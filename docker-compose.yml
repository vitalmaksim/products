services:
  migrate:
    build:
      context: .
      dockerfile: docker/goose.Dockerfile
    profiles:
      - tools
    depends_on:
      - db
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "postgres://products:products@db:5432/products?sslmode=disable"
      GOOSE_MIGRATION_DIR: /migrations
    volumes:
      - ./database/migrations:/migrations
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: products
      POSTGRES_PASSWORD: products
      POSTGRES_DB: products
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  